<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LAMBDA Web Front-End</title><link rel="stylesheet" href="style.css"></head><body><main><h1>LAMBDA Web Front-End</h1><p>Enter one restricted LAMBDA constructor expression.</p><section aria-labelledby="source-heading"><h2 id="source-heading">Source</h2><label for="source-menu">Load source</label><select id="source-menu"><option value="">Choose…</option><option value="manual">Manual input</option><option value="factorial">Factorial (canned)</option><option value="fibonacci">Fibonacci (canned)</option></select><label for="file">Choose File</label><input id="file" type="file" accept=".txt,.lambda,text/plain"><p><span id="source-name">No source loaded</span> · <span id="revision">Revision 0</span></p><label for="source">Editable source</label><textarea id="source" rows="12" spellcheck="false" aria-describedby="source-help"></textarea><p id="source-help">UTF-8 text, maximum 65,536 bytes. Changes are local to this application.</p><button id="apply" disabled>Apply changes</button><button id="discard" disabled>Discard changes</button></section><section aria-labelledby="actions-heading"><h2 id="actions-heading">Operations</h2><div class="actions"><button id="lint" disabled>Lint</button><button id="interpret" disabled>Interpret</button><button id="typecheck" disabled>Type-check</button><button id="compile" disabled>Compile</button><button id="execute" disabled>Execute</button></div><p id="status" role="status" aria-live="polite">Ready.</p></section><section aria-labelledby="results-heading"><h2 id="results-heading">Results</h2><div id="results"></div></section></main><script type="module" src="app.js"></script></body></html>
